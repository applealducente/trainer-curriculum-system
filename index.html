<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trainer Portal</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 20px; }
        .container { background: white; border-radius: 12px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); max-width: 1000px; margin: 0 auto; overflow: hidden; }
        .header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 30px; text-align: center; position: relative; }
        .header h1 { font-size: 28px; margin-bottom: 8px; }
        .logout-top { position: absolute; top: 20px; right: 30px; padding: 8px 16px; background: rgba(255,255,255,0.2); border: 1px solid white; color: white; border-radius: 6px; cursor: pointer; font-size: 12px; }
        
        .login-screen { }
        .home-screen { display: none; }
        .home-screen.active { display: block; }
        .activity-screen { display: none; }
        .activity-screen.active { display: block; }
        
        .portal-header { padding: 20px 30px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px; }
        .portal-header h2 { font-size: 20px; color: #333; }
        .portal-content { padding: 30px; }
        
        .auth-section { padding: 40px; max-width: 450px; margin: 40px auto; text-align: center; }
        .auth-section h2 { margin-bottom: 30px; color: #333; font-size: 24px; }
        .form-group { margin-bottom: 15px; text-align: left; }
        .form-group label { display: block; margin-bottom: 8px; color: #555; font-weight: 500; }
        .form-group input, .form-group select { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; }
        .btn { width: 100%; padding: 12px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; }
        
        .trainer-name { text-align: center; padding: 20px; background: #f0f4ff; border-radius: 8px; margin-bottom: 30px; }
        .trainer-name h3 { color: #667eea; }
        
        .nav-tabs { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 2px solid #eee; }
        .nav-tab { padding: 12px 20px; background: none; border: none; cursor: pointer; font-weight: 600; color: #999; border-bottom: 3px solid transparent; }
        .nav-tab.active { color: #667eea; border-bottom-color: #667eea; }
        
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        
        .day-tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
        .day-tile { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 18px; border-radius: 10px; cursor: pointer; text-align: center; transition: transform 0.2s; }
        .day-tile:hover { transform: translateY(-5px); }
        .day-tile h4 { font-size: 14px; margin-bottom: 6px; }
        .day-tile p { font-size: 11px; opacity: 0.9; }
        
        .form-card { background: #f9f9f9; padding: 15px; border-radius: 8px; border-left: 4px solid #667eea; margin-bottom: 12px; }
        .form-card h4 { margin-bottom: 8px; color: #333; font-size: 13px; }
        .form-card a { display: inline-block; padding: 6px 12px; background: #667eea; color: white; border-radius: 4px; text-decoration: none; font-size: 11px; font-weight: 600; }
        
        .activity-card { background: white; border: 2px solid #667eea; border-radius: 10px; padding: 20px; margin-bottom: 15px; }
        .activity-header { display: flex; justify-content: space-between; margin-bottom: 12px; }
        .activity-title { font-size: 16px; font-weight: 600; color: #333; }
        .activity-time { font-size: 12px; color: #667eea; }
        .badges { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
        .badge { display: inline-block; padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 600; background: #e0f2fe; color: #0369a1; }
        .badge.break { background: #fef3c7; color: #92400e; }
        .material-link { background: #f0f4ff; padding: 12px; border-radius: 6px; margin-bottom: 12px; font-size: 12px; }
        .activity-actions { display: flex; gap: 10px; }
        .action-btn { flex: 1; padding: 10px; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 12px; }
        .action-btn.primary { background: #10b981; color: white; }
        .action-btn.secondary { background: #f0f0f0; color: #333; }
        
        .progress-indicator { text-align: center; padding: 15px; background: #f0f4ff; border-radius: 8px; margin-bottom: 15px; }
        .progress-bar { width: 100%; height: 6px; background: #ddd; border-radius: 3px; margin-bottom: 8px; }
        .progress-fill { height: 100%; background: #10b981; transition: width 0.3s; }
        
        .congratulations { text-align: center; padding: 50px 20px; background: linear-gradient(135deg, #10b981 0%, #059669 100%); border-radius: 10px; color: white; }
        .congratulations h2 { font-size: 32px; margin-bottom: 10px; }
        .congratulations p { font-size: 16px; margin-bottom: 30px; }
        .cta-btn { max-width: 300px; margin: 10px auto; }
        
        .back-btn { padding: 10px 20px; background: #f0f0f0; border: 1px solid #ddd; border-radius: 6px; cursor: pointer; margin-bottom: 15px; font-size: 12px; }
        
        .async-materials { background: #fff3cd; padding: 15px; border-radius: 8px; border-left: 4px solid #ffc107; margin-bottom: 15px; }
        .async-materials h4 { color: #856404; margin-bottom: 10px; }
        .async-item { margin-bottom: 8px; }
        .async-item input { margin-right: 8px; }
        
        .day10-approval { background: #d1ecf1; padding: 20px; border-radius: 8px; margin-bottom: 20px; }
        .day10-approval h3 { color: #0c5460; margin-bottom: 15px; }
        .approval-checklist { list-style: none; }
        .approval-checklist li { padding: 10px; margin-bottom: 8px; background: white; border-radius: 6px; }
        .approval-checklist input { margin-right: 10px; }
        
        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-20px); } }
    </style>
</head>

        function trainerLogin() {
            const name = document.getElementById('trainerName').value.trim();
            if (!name) {
                alert('Please enter your name');
                return;
            }
            currentUser = { name };
            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('homeScreen').classList.add('active');
            document.getElementById('displayName').textContent = name;
            loadDayTiles();
            loadForms();
        }

        function loadDayTiles() {
            let html = '';
            for (let day = 1; day <= 10; day++) {
                const dayData = curriculum[day.toString()];
                html += `<div class="day-tile" onclick="startDay(${day})"><h4>Day ${day}</h4><p>${dayData.title}</p></div>`;
            }
            document.getElementById('dayTiles').innerHTML = html;
        }

        function startDay(day) {
            currentDay = day.toString();
            currentActivityIndex = 0;
            document.getElementById('homeScreen').classList.remove('active');
            document.getElementById('activityScreen').classList.add('active');
            displayCurrentActivity();
        }

        function displayCurrentActivity() {
            const dayData = curriculum[currentDay];
            const activities = dayData.activities.filter(a => !a.asyncMaterials && !a.validation);
            
            document.getElementById('dayTitle').textContent = `Day ${currentDay} - ${dayData.title}`;
            
            if (currentDay === "9") {
                displayDay9();
                return;
            }
            
            if (currentDay === "10") {
                displayDay10();
                return;
            }
            
            const activity = activities[currentActivityIndex];
            const progress = ((currentActivityIndex + 1) / activities.length) * 100;
            
            document.getElementById('progressSection').innerHTML = `
                <div class="progress-indicator">
                    <div class="progress-bar"><div class="progress-fill" style="width: ${progress}%"></div></div>
                    <div style="font-size: 12px; color: #666;">Activity ${currentActivityIndex + 1} of ${activities.length}</div>
                </div>
            `;
            
            const materialHtml = activity.material ? `<div class="material-link">📊 ${activity.material}</div>` : '';
            
            document.getElementById('activityContent').innerHTML = `
                <div class="activity-card ${activity.delivery === '—' ? 'break' : ''}">
                    <div class="activity-header">
                        <div class="activity-title">${activity.name}</div>
                        <div class="activity-time">${activity.time}</div>
                    </div>
                    <div class="badges">
                        <span class="badge">${activity.delivery === '—' ? '☕ Break' : activity.delivery}</span>
                    </div>
                    ${materialHtml}
                    <div class="activity-actions">
                        <button class="action-btn primary" onclick="completeActivity()">✓ Done</button>
                    </div>
                </div>
            `;

            let html = `
                <div class="async-materials">
                    <h4>📚 ASYNC MATERIALS - Complete on Your Own Time</h4>
                    <p style="font-size: 12px; margin-bottom: 12px; color: #666;">These materials must be reviewed before Day 10</p>
                    ${asyncMaterials.map((mat, idx) => `
                        <div class="async-item">
                            <input type="checkbox" id="async_${idx}"> <label for="async_${idx}" style="cursor: pointer;">${mat.title}</label>
                        </div>
                    `).join('')}
                </div>
            `;
            
            document.getElementById('activityContent').innerHTML = html;
        }

        function displayDay10() {
            const html = `
                <div class="day10-approval">
                    <h3>✅ FORM VALIDATION & ASYNC MATERIALS CHECK (First 30 mins)</h3>
                    <p style="margin-bottom: 15px; font-size: 13px;">Verify trainees have completed all requirements:</p>
                    <ul class="approval-checklist">
                        <li><input type="checkbox"> All forms completed</li>
                        <li><input type="checkbox"> Pay Structure reviewed</li>
                        <li><input type="checkbox"> PV (Protocol Violation) reviewed</li>
                        <li><input type="checkbox"> ZTP (Zero Tolerance Policy) reviewed</li>
                        <li><input type="checkbox"> Nesting Expectations reviewed</li>
                        <li><input type="checkbox"> Nesting House Rules reviewed</li>
                    </ul>
                    <button class="btn" style="margin-top: 20px;" onclick="approveDay10()">✓ All Requirements Met - Ready to Dial!</button>
                </div>
            `;
            document.getElementById('activityContent').innerHTML = html;
        }

        function approveDay10() {
            document.getElementById('activityContent').innerHTML = `
                <div class="congratulations">
                    <div style="font-size: 80px; margin-bottom: 20px; animation: bounce 1s infinite;">🚀</div>
                    <h2>GOODLUCK!</h2>
                    <h2 style="font-size: 36px; margin-bottom: 30px;">CLOSE A LOT OF SALES!</h2>
                    <p style="font-size: 18px;">Time to make those calls!</p>
                    <button class="btn cta-btn" style="margin-top: 30px;" onclick="startLiveCalls()">→ Start Live Calls</button>
                </div>
            `;
        }

        function startLiveCalls() {
            showCongratulations();
        }

        function completeActivity() {
            const dayData = curriculum[currentDay];
            const activities = dayData.activities.filter(a => !a.asyncMaterials && !a.validation);
            
            if (currentActivityIndex < activities.length - 1) {
                currentActivityIndex++;
                displayCurrentActivity();
            } else {
                showCongratulations();
            }
        }

        function showCongratulations() {
            const nextDay = parseInt(currentDay) + 1;
            document.getElementById('activityContent').innerHTML = `
                <div class="congratulations">
                    <div style="font-size: 80px; margin-bottom: 20px; animation: bounce 1s infinite;">🎉</div>
                    <h2>Congratulations!</h2>
                    <p>You've completed all activities for Day ${currentDay}</p>
                    ${curriculum[nextDay.toString()] ? `<button class="btn cta-btn" onclick="backToHome()">→ Next Day Tomorrow</button>` : ''}
                </div>
            `;
        }

        function loadForms() {
            const forms = [
                { name: "Onboarding Form", dueDay: 1, link: "" },
                { name: "Skills Assessment", dueDay: 3, link: "" },
                { name: "Day 9 Compliance Forms", dueDay: 9, link: "" }
            ];
            let html = forms.map(f => `
                <div class="form-card">
                    <h4>${f.name}</h4>
                    <p>Due: Day ${f.dueDay}</p>
                    <a href="${f.link || '#'}" target="_blank">Fill Form →</a>
                </div>
            `).join('');
            document.getElementById('formsList').innerHTML = html;
        }

        function switchTab(tab) {
            document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            event.target.classList.add('active');
            document.getElementById(tab + '-tab').classList.add('active');
        }

        function backToHome() {
            document.getElementById('activityScreen').classList.remove('active');
            document.getElementById('homeScreen').classList.add('active');
            currentDay = null;
            currentActivityIndex = 0;
        }

        function switchToAdmin() {
            const password = prompt('Enter admin password:');
            if (!password) return;
            
            const adminPassword = localStorage.getItem('adminPassword') || 'admin123';
            if (password !== adminPassword) {
                alert('Incorrect password');
                return;
            }
            
            document.getElementById('homeScreen').classList.remove('active');
            document.getElementById('adminScreen').style.display = 'block';
            loadAdminStats();
            loadMaterialLinksForm();
        }
        
        function loadAdminStats() {
            document.getElementById('adminStats').innerHTML = `
                <div style="background: #f0f4ff; padding: 20px; border-radius: 8px; text-align: center;">
                    <h3 style="color: #667eea; margin-bottom: 15px;">📊 Dashboard Stats</h3>
                    <p style="color: #666; font-size: 14px;">Activity tracking coming soon...</p>
                </div>
            `;
        }
        
        function loadMaterialLinksForm() {
            let html = '';
            for (let day = 1; day <= 10; day++) {
                const dayData = curriculum[day.toString()];
                html += `<h4 style="margin-top: 15px; margin-bottom: 10px;">Day ${day} - ${dayData.title}</h4>`;
                dayData.activities.forEach((act, idx) => {
                    if (act.material && act.material.trim()) {
                        html += `
                            <div class="form-group" style="margin-bottom: 10px;">
                                <label>${act.time} - ${act.name}</label>
                                <input type="text" id="link_${day}_${idx}" placeholder="Paste material link here">
                            </div>
                        `;
                    }
                });
            }
            document.getElementById('materialLinksForm').innerHTML = html;
        }
        
        function switchAdminTab(tab) {
            document.querySelectorAll('#adminScreen .nav-tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('#adminScreen .tab-content').forEach(c => c.classList.remove('active'));
            event.target.classList.add('active');
            document.getElementById(tab + '-tab').classList.add('active');
        }
        
        function saveAdminPassword() {
            const newPassword = document.getElementById('newAdminPassword').value;
            if (!newPassword) {
                alert('Please enter a password');
                return;
            }
            localStorage.setItem('adminPassword', newPassword);
            alert('✓ Password saved!');
            document.getElementById('newAdminPassword').value = '';
        }
        
        function saveMaterialLinks() {
            alert('✓ Links would be saved here (Firebase integration needed)');
        }
        
    </script>
</body>
</html>
