<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trainer Portal</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 20px; }
        .container { background: white; border-radius: 12px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); max-width: 1200px; width: 100%; margin: 0 auto; }
        .header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 30px; text-align: center; }
        .header h1 { font-size: 28px; margin-bottom: 8px; }
        
        .screen { display: none; }
        .screen.active { display: block; }
        
        .portal-header { padding: 20px 30px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; }
        .portal-header h2 { margin: 0; font-size: 20px; color: #333; }
        .btn-group { display: flex; gap: 10px; }
        .btn-header { padding: 8px 12px; background: rgba(255,255,255,0.2); border: 1px solid white; color: white; border-radius: 6px; cursor: pointer; font-size: 11px; white-space: nowrap; }
        .btn-header.admin { background: rgba(255,193,7,0.2); border-color: #ffc107; color: #ffc107; }
        
        .portal-content { padding: 30px; }
        .welcome { text-align: center; padding: 20px; background: #f0f4ff; border-radius: 8px; margin-bottom: 30px; }
        .welcome h3 { color: #667eea; }
        
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 2px solid #eee; flex-wrap: wrap; }
        .tab-btn { padding: 12px 20px; background: none; border: none; cursor: pointer; font-weight: 600; color: #999; border-bottom: 3px solid transparent; }
        .tab-btn.active { color: #667eea; border-bottom-color: #667eea; }
        
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        
        .day-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; }
        .day-card { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 18px; border-radius: 10px; cursor: pointer; text-align: center; transition: transform 0.2s; }
        .day-card:hover { transform: translateY(-5px); }
        .day-card h4 { font-size: 14px; margin-bottom: 6px; }
        .day-card p { font-size: 11px; opacity: 0.9; }
        
        .activity-box { background: white; border: 2px solid #667eea; border-radius: 10px; padding: 20px; margin-bottom: 15px; }
        .activity-header { display: flex; justify-content: space-between; margin-bottom: 12px; align-items: center; }
        .activity-header h4 { font-size: 16px; color: #333; }
        .activity-time { font-size: 12px; color: #667eea; }
        .badge { display: inline-block; padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 600; background: #e0f2fe; color: #0369a1; }
        .done-btn { padding: 10px 20px; background: #10b981; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; margin-top: 10px; width: 100%; }
        
        .progress { padding: 15px; background: #f0f4ff; border-radius: 8px; margin-bottom: 15px; text-align: center; }
        .progress-bar { width: 100%; height: 6px; background: #ddd; border-radius: 3px; margin-bottom: 8px; }
        .progress-fill { height: 100%; background: #10b981; }
        
        .congratulations { text-align: center; padding: 50px 20px; background: linear-gradient(135deg, #10b981 0%, #059669 100%); border-radius: 10px; color: white; }
        .congratulations h2 { font-size: 32px; margin-bottom: 10px; }
        .congratulations p { font-size: 16px; margin-bottom: 30px; }
        .back-btn { padding: 10px 20px; background: #f0f0f0; border: 1px solid #ddd; border-radius: 6px; cursor: pointer; margin-bottom: 20px; }
        
        .async-box { background: #fff3cd; padding: 20px; border-radius: 8px; border-left: 4px solid #ffc107; margin-bottom: 20px; }
        .async-box h4 { color: #856404; margin-bottom: 12px; }
        .async-item { color: #856404; margin-bottom: 8px; }
        
        .approval-box { background: #d1ecf1; padding: 20px; border-radius: 8px; margin-bottom: 20px; }
        .approval-box h3 { color: #0c5460; margin-bottom: 15px; }
        .checklist { background: white; padding: 15px; border-radius: 6px; }
        .checklist li { padding: 8px; margin-bottom: 6px; list-style: none; }
        .checklist input { margin-right: 10px; }
        
        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-20px); } }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📚 Trainer Portal</h1>
            <p>Dynamic Curriculum Platform</p>
        </div>
        
        <!-- LOGIN SCREEN -->
        <div id="loginScreen" class="screen active">
            <div style="padding: 40px; max-width: 450px; margin: 40px auto; text-align: center;">
                <h2 style="margin-bottom: 30px; color: #333; font-size: 24px;">Welcome Back!</h2>
                <div style="margin-bottom: 15px;">
                    <label style="display: block; margin-bottom: 8px; color: #555; font-weight: 500;">Enter Your Name</label>
                    <input type="text" id="trainerName" placeholder="Your name" style="width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 6px;">
                </div>
                <button class="done-btn" onclick="login()" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);">Start Training</button>
            </div>
        </div>
        
        <!-- LOBBY SCREEN -->
        <div id="lobbyScreen" class="screen">
            <div class="portal-header">
                <h2>🏠 Training Dashboard</h2>
                <div class="btn-group">
                    <button class="btn-header admin" onclick="adminLogin()">🔐 Admin</button>
                    <button class="btn-header" onclick="logout()">Logout</button>
                </div>
            </div>
            <div class="portal-content">
                <div class="welcome">
                    <h3>Welcome, <span id="userName"></span>! 👋</h3>
                </div>
                
                <div class="tabs">
                    <button class="tab-btn active" onclick="showTab('days')">📅 Days</button>
                    <button class="tab-btn" onclick="showTab('forms')">📋 Forms</button>
                    <button class="tab-btn" onclick="showTab('responses')">✅ Responses</button>
                </div>
                
                <div id="daysTab" class="tab-content active">
                    <div class="day-grid" id="dayGrid"></div>
                </div>
                
                <div id="formsTab" class="tab-content">
                    <p style="color: #666;">📋 Forms will appear here</p>
                </div>
                
                <div id="responsesTab" class="tab-content">
                    <p style="color: #666;">✅ Responses will appear here</p>
                </div>
            </div>
        </div>
        
        <!-- ACTIVITY SCREEN -->
        <div id="activityScreen" class="screen">
            <div class="portal-header">
                <h2 id="dayTitle">Day 1</h2>
                <button class="btn-header" onclick="backToLobby()">← Lobby</button>
            </div>
            <div class="portal-content">
                <button class="back-btn" onclick="backToLobby()">← Back to Lobby</button>
                <div id="progressDiv"></div>
                <div id="activityDiv"></div>
            </div>
        </div>
        
        <!-- ADMIN SCREEN -->
        <div id="adminScreen" class="screen">
            <div class="portal-header">
                <h2>🔐 Admin Dashboard</h2>
                <button class="btn-header" onclick="backToLobby()">← Lobby</button>
            </div>
            <div class="portal-content">
                <p style="color: #666;">Admin features coming soon...</p>
            </div>
        </div>
    </div>

    <script>
        const curriculum = {
            "1": { title: "Orientation, Setup & FC Foundation", activities: [
                { time: "8:00–9:00", name: "Roll Call / Initial Attendance", delivery: "Trainer-led" },
                { time: "9:00–10:30", name: "Introduction & House Rules", delivery: "Trainer-led" },
                { time: "10:30–10:45", name: "Paid Break", delivery: "—" },
                { time: "10:45–12:45", name: "Account Setup: Hubstaff, Slack & Gmail", delivery: "Guided setup" },
                { time: "12:45–1:45", name: "Lunch", delivery: "—" },
                { time: "1:45–3:45", name: "Onboarding Forms", delivery: "Guided setup" },
                { time: "3:45–4:00", name: "Paid Break", delivery: "—" },
                { time: "4:00–5:00", name: "FC 101", delivery: "Instructor-led" }
            ]},
            "2": { title: "Product Knowledge & Application", activities: [
                { time: "8:00–9:00", name: "Review Activity", delivery: "Trainer-led" },
                { time: "9:00–10:00", name: "FC Sales Process Playbook Part 1", delivery: "Instructor-led" },
                { time: "10:00–10:15", name: "Paid Break", delivery: "—" },
                { time: "10:15–12:45", name: "FC Sales Continuation", delivery: "Instructor-led" },
                { time: "12:45–1:45", name: "Lunch", delivery: "—" },
                { time: "1:45–2:45", name: "Staging Websites", delivery: "Demo" },
                { time: "2:45–3:45", name: "CRM Simulation", delivery: "Guided practice" },
                { time: "3:45–4:00", name: "Paid Break", delivery: "—" },
                { time: "4:00–5:00", name: "Individual Practice", delivery: "Hands-on" }
            ]},
            "3": { title: "Trial / OTC + Call Flow Foundation", activities: [
                { time: "8:00–8:30", name: "Review", delivery: "Trainer-led" },
                { time: "8:30–10:30", name: "Trial & OTC Playbook", delivery: "Instructor-led" },
                { time: "10:30–10:45", name: "Paid Break", delivery: "—" },
                { time: "10:45–12:15", name: "Call Flow Familiarization", delivery: "Instructor-led" },
                { time: "12:15–1:15", name: "Lunch", delivery: "—" },
                { time: "1:15–1:45", name: "FC 101 Quiz", delivery: "Assessment" },
                { time: "1:45–3:45", name: "Full Journey Walkthrough", delivery: "Guided" },
                { time: "3:45–4:00", name: "Paid Break", delivery: "—" },
                { time: "4:00–5:00", name: "YES Customer AI", delivery: "AI simulation" }
            ]},
            "4": { title: "YES Customer AI + Coaching", activities: [
                { time: "8:00–8:30", name: "YES Briefing", delivery: "Trainer-led" },
                { time: "8:30–10:30", name: "Product Test", delivery: "Assessment" },
                { time: "10:30–10:45", name: "Paid Break", delivery: "—" },
                { time: "10:45–12:45", name: "YES Simulation", delivery: "AI simulation" },
                { time: "12:45–1:45", name: "Lunch", delivery: "—" },
                { time: "1:45–3:45", name: "Coaching", delivery: "Trainer coaching" },
                { time: "3:45–4:00", name: "Paid Break", delivery: "—" },
                { time: "4:00–5:00", name: "Results & Direction", delivery: "Trainer-led" }
            ]},
            "5": { title: "Sales Discovery + AI Application", activities: [
                { time: "8:00–9:00", name: "Trial & OTC Quiz", delivery: "Assessment" },
                { time: "9:00–10:00", name: "Call Listening", delivery: "Facilitated" },
                { time: "10:00–10:15", name: "Paid Break", delivery: "—" },
                { time: "10:15–12:45", name: "Sales Discovery", delivery: "Instructor-led" },
                { time: "12:45–1:45", name: "Lunch", delivery: "—" },
                { time: "1:45–3:45", name: "Discovery Simulation", delivery: "AI simulation" },
                { time: "3:45–4:00", name: "Paid Break", delivery: "—" },
                { time: "4:00–5:00", name: "Full-Call Practice", delivery: "AI simulation" }
            ]},
            "6": { title: "Core Sales Skills + AI Application", activities: [
                { time: "8:00–9:30", name: "Hook, Engage & Close", delivery: "Instructor-led" },
                { time: "9:30–10:30", name: "Features as Benefits 1", delivery: "Instructor-led" },
                { time: "10:30–10:45", name: "Paid Break", delivery: "—" },
                { time: "10:45–11:45", name: "Features as Benefits 2", delivery: "Instructor-led" },
                { time: "11:45–12:45", name: "Objection Handling 1", delivery: "Instructor-led" },
                { time: "12:45–1:45", name: "Lunch", delivery: "—" },
                { time: "1:45–2:45", name: "Objection Handling 2", delivery: "Instructor-led" },
                { time: "2:45–3:00", name: "Paid Break", delivery: "—" },
                { time: "3:00–5:00", name: "Skills AI Simulation", delivery: "AI simulation" }
            ]},
            "7": { title: "AI Simulation Intensive", activities: [
                { time: "8:00–10:30", name: "AI Simulation", delivery: "AI simulation" },
                { time: "10:30–10:45", name: "Paid Break", delivery: "—" },
                { time: "10:45–12:45", name: "AI Simulation", delivery: "AI simulation" },
                { time: "12:45–1:45", name: "Lunch", delivery: "—" },
                { time: "1:45–3:45", name: "AI Simulation", delivery: "AI simulation" },
                { time: "3:45–4:00", name: "Paid Break", delivery: "—" },
                { time: "4:00–5:00", name: "Performance Review", delivery: "AI simulation" }
            ]},
            "8": { title: "Mock Call Certification", activities: [
                { time: "8:00–10:30", name: "Mock Call Cert", delivery: "Certification" },
                { time: "10:30–10:45", name: "Paid Break", delivery: "—" },
                { time: "10:45–12:45", name: "Mock Call Cert", delivery: "Certification" },
                { time: "12:45–1:45", name: "Lunch", delivery: "—" },
                { time: "1:45–3:45", name: "Coaching", delivery: "Trainer coaching" },
                { time: "3:45–4:00", name: "Paid Break", delivery: "—" },
                { time: "4:00–5:00", name: "Live Launch Prep", delivery: "Trainer-led" }
            ]},
            "9": { title: "Systems, Tools & Live-Call Readiness", isAsync: true, activities: [
                { time: "8:00–8:30", name: "Morning Stand-up", delivery: "Trainer-led" },
                { time: "8:30–10:30", name: "QA Talk", delivery: "QA-led" },
                { time: "10:30–10:45", name: "Paid Break", delivery: "—" },
                { time: "10:45–12:15", name: "HubSpot Setup 1", delivery: "Trainer-guided" },
                { time: "12:15–1:15", name: "Lunch", delivery: "—" },
                { time: "1:15–2:45", name: "HubSpot Setup 2", delivery: "Trainer-guided" },
                { time: "2:45–3:00", name: "Paid Break", delivery: "—" },
                { time: "3:00–4:00", name: "Lead Management", delivery: "Trainer-led" },
                { time: "4:00–5:00", name: "Disposition Guide", delivery: "Demo" }
            ], asyncMaterials: ["Pay Structure", "PV (Protocol Violation)", "ZTP (Zero Tolerance Policy)", "Nesting Expectations", "Nesting House Rules"]},
            "10": { title: "Live Call Launch", isValidation: true, activities: [
                { time: "8:00–8:30", name: "Morning Stand-up", delivery: "Trainer-led" },
                { time: "8:30–10:30", name: "🔴 LIVE CALLS", delivery: "Production calls" },
                { time: "10:30–10:45", name: "Paid Break", delivery: "—" },
                { time: "10:45–12:45", name: "🔴 LIVE CALLS", delivery: "Production calls" },
                { time: "12:45–1:45", name: "Lunch", delivery: "—" },
                { time: "1:45–3:45", name: "🔴 LIVE CALLS", delivery: "Production calls" },
                { time: "3:45–4:00", name: "Paid Break", delivery: "—" },
                { time: "4:00–4:30", name: "🔴 LIVE CALLS", delivery: "Production calls" },
                { time: "4:30–5:00", name: "EOD Debrief", delivery: "Trainer-led" }
            ]}
        };

        let currentUser = null;
        let currentDay = null;
        let currentActivityIndex = 0;

        function login() {
            const name = document.getElementById('trainerName').value.trim();
            if (!name) { alert('Please enter your name'); return; }
            currentUser = name;
            document.getElementById('loginScreen').classList.remove('active');
            document.getElementById('lobbyScreen').classList.add('active');
            document.getElementById('userName').textContent = name;
            loadDays();
        }

        function loadDays() {
            let html = '';
            for (let i = 1; i <= 10; i++) {
                const day = curriculum[i.toString()];
                html += `<div class="day-card" onclick="selectDay(${i})"><h4>Day ${i}</h4><p>${day.title}</p></div>`;
            }
            document.getElementById('dayGrid').innerHTML = html;
        }

        function selectDay(day) {
            currentDay = day;
            currentActivityIndex = 0;
            document.getElementById('lobbyScreen').classList.remove('active');
            document.getElementById('activityScreen').classList.add('active');
            showActivity();
        }

        function showActivity() {
            const dayData = curriculum[currentDay.toString()];
            document.getElementById('dayTitle').textContent = `Day ${currentDay} - ${dayData.title}`;
            
            // Day 9: Show async materials
            if (currentDay === 9) {
                document.getElementById('progressDiv').innerHTML = '';
                document.getElementById('activityDiv').innerHTML = `
                    <div class="async-box">
                        <h4>📚 ASYNC MATERIALS - Review on Your Own Time</h4>
                        <p style="font-size: 12px; margin-bottom: 12px; color: #666;">Complete before Day 10:</p>
                        ${dayData.asyncMaterials.map(m => `<div class="async-item">✓ ${m}</div>`).join('')}
                    </div>
                    <div class="activity-box">
                        <h4>Day 9 Activities:</h4>
                        ${dayData.activities.map(a => `
                            <div style="padding: 10px; border-bottom: 1px solid #eee;">
                                <div style="display: flex; justify-content: space-between;">
                                    <div>${a.name}</div>
                                    <div style="font-size: 11px; color: #667eea;">${a.time}</div>
                                </div>
                                <div style="font-size: 11px; color: #666;">${a.delivery}</div>
                            </div>
                        `).join('')}
                    </div>
                `;
                return;
            }
            
            // Day 10: Show validation
            if (currentDay === 10) {
                document.getElementById('progressDiv').innerHTML = '';
                document.getElementById('activityDiv').innerHTML = `
                    <div class="approval-box">
                        <h3>✅ FORM VALIDATION (First 30 mins)</h3>
                        <ul class="checklist">
                            <li><input type="checkbox"> All forms completed</li>
                            <li><input type="checkbox"> Pay Structure reviewed</li>
                            <li><input type="checkbox"> PV reviewed</li>
                            <li><input type="checkbox"> ZTP reviewed</li>
                            <li><input type="checkbox"> Nesting Expectations reviewed</li>
                            <li><input type="checkbox"> Nesting House Rules reviewed</li>
                        </ul>
                        <button class="done-btn" style="margin-top: 20px;" onclick="showMotivational()">✓ All Complete - Ready to Dial!</button>
                    </div>
                    <div class="activity-box">
                        <h4>Day 10 Activities:</h4>
                        ${dayData.activities.map(a => `
                            <div style="padding: 10px; border-bottom: 1px solid #eee;">
                                <div style="display: flex; justify-content: space-between;">
                                    <div>${a.name}</div>
                                    <div style="font-size: 11px; color: #667eea;">${a.time}</div>
                                </div>
                                <div style="font-size: 11px; color: #666;">${a.delivery}</div>
                            </div>
                        `).join('')}
                    </div>
                `;
                return;
            }
            
            // Normal days: Show activities
            const activities = dayData.activities;
            const activity = activities[currentActivityIndex];
            const progress = ((currentActivityIndex + 1) / activities.length) * 100;
            
            document.getElementById('progressDiv').innerHTML = `
                <div class="progress">
                    <div class="progress-bar"><div class="progress-fill" style="width: ${progress}%"></div></div>
                    Activity ${currentActivityIndex + 1} of ${activities.length}
                </div>
            `;
            
            document.getElementById('activityDiv').innerHTML = `
                <div class="activity-box">
                    <div class="activity-header">
                        <h4>${activity.name}</h4>
                        <div class="activity-time">${activity.time}</div>
                    </div>
                    <span class="badge">${activity.delivery}</span>
                    <button class="done-btn" onclick="nextActivity()">✓ Done</button>
                </div>
            `;
        }

        function nextActivity() {
            const dayData = curriculum[currentDay.toString()];
            if (currentActivityIndex < dayData.activities.length - 1) {
                currentActivityIndex++;
                showActivity();
            } else {
                showCongrats();
            }
        }

        function showMotivational() {
            document.getElementById('activityDiv').innerHTML = `
                <div class="congratulations">
                    <div style="font-size: 80px; margin-bottom: 20px; animation: bounce 1s infinite;">🚀</div>
                    <h2>GOODLUCK!</h2>
                    <h2 style="font-size: 36px; margin-bottom: 30px;">CLOSE A LOT OF SALES!</h2>
                    <p>Time to make those calls! 📞</p>
                    <button class="done-btn" style="margin-top: 30px; max-width: 300px; margin-left: auto; margin-right: auto;" onclick="backToLobby()">→ Back to Lobby</button>
                </div>
            `;
        }

        function showCongrats() {
            document.getElementById('activityDiv').innerHTML = `
                <div class="congratulations">
                    <div style="font-size: 80px; margin-bottom: 20px; animation: bounce 1s infinite;">🎉</div>
                    <h2>Congratulations!</h2>
                    <p>You've completed all activities for Day ${currentDay}</p>
                    <button class="done-btn" style="margin-top: 30px; max-width: 300px; margin-left: auto; margin-right: auto;" onclick="backToLobby()">→ Back to Lobby</button>
                </div>
            `;
        }

        function showTab(tab) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(tab + 'Tab').classList.add('active');
            event.target.classList.add('active');
        }

        function backToLobby() {
            currentDay = null;
            currentActivityIndex = 0;
            document.getElementById('activityScreen').classList.remove('active');
            document.getElementById('adminScreen').classList.remove('active');
            document.getElementById('lobbyScreen').classList.add('active');
        }

        function adminLogin() {
            const pwd = prompt('Admin password:');
            if (pwd === 'admin123') {
                document.getElementById('lobbyScreen').classList.remove('active');
                document.getElementById('adminScreen').classList.add('active');
            } else {
                alert('Incorrect password');
            }
        }

        function logout() {
            if (confirm('Logout?')) {
                currentUser = null;
                document.getElementById('loginScreen').classList.add('active');
                document.getElementById('lobbyScreen').classList.remove('active');
                document.getElementById('trainerName').value = '';
            }
        }
    </script>
</body>
</html>
