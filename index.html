<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trainer Portal</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 20px; }
        .container { background: white; border-radius: 12px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); max-width: 900px; margin: 0 auto; overflow: hidden; }
        .header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 30px; text-align: center; }
        .header h1 { font-size: 28px; margin-bottom: 8px; }
        .auth-section { padding: 40px; max-width: 450px; margin: 40px auto; text-align: center; }
        .auth-section h2 { margin-bottom: 30px; color: #333; font-size: 24px; }
        .role-buttons { display: flex; gap: 15px; margin-bottom: 30px; }
        .role-btn { flex: 1; padding: 12px 20px; border: 2px solid #ddd; background: white; border-radius: 8px; cursor: pointer; font-weight: 500; }
        .role-btn.active { border-color: #667eea; background: #667eea; color: white; }
        .form-group { margin-bottom: 15px; text-align: left; }
        .form-group label { display: block; margin-bottom: 8px; color: #555; font-weight: 500; }
        .form-group input, .form-group select { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; }
        .btn { width: 100%; padding: 12px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; }
        .trainer-portal { display: none; }
        .trainer-portal.active { display: block; }
        .admin-portal { display: none; }
        .admin-portal.active { display: block; }
        .portal-header { padding: 20px 30px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; }
        .logout-btn { padding: 8px 16px; background: #f0f0f0; border: 1px solid #ddd; border-radius: 6px; cursor: pointer; }
        .portal-content { padding: 30px; }
        .activity-card { background: white; border: 2px solid #667eea; border-radius: 10px; padding: 25px; margin-bottom: 20px; }
        .activity-card.break { border-color: #fbbf24; background: #fffbeb; }
        .activity-header { display: flex; justify-content: space-between; margin-bottom: 15px; }
        .activity-title { font-size: 18px; font-weight: 600; color: #333; }
        .activity-time { font-size: 13px; color: #667eea; font-weight: 600; }
        .badges { display: flex; gap: 8px; margin-bottom: 15px; flex-wrap: wrap; }
        .badge { display: inline-block; padding: 6px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; background: #e0f2fe; color: #0369a1; }
        .badge.break { background: #fef3c7; color: #92400e; }
        .activity-details { background: #f9f9f9; padding: 15px; border-radius: 6px; margin-bottom: 15px; font-size: 13px; }
        .activity-actions { display: flex; gap: 12px; }
        .action-btn { flex: 1; padding: 12px; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; text-decoration: none; display: flex; align-items: center; justify-content: center; }
        .action-btn.primary { background: #10b981; color: white; }
        .action-btn.secondary { background: #f0f0f0; color: #333; }
        .admin-tabs { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 2px solid #eee; }
        .admin-tab { padding: 12px 20px; background: none; border: none; cursor: pointer; font-weight: 600; color: #999; border-bottom: 3px solid transparent; }
        .admin-tab.active { color: #667eea; border-bottom-color: #667eea; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .settings-form { background: #f9f9f9; padding: 20px; border-radius: 8px; margin-bottom: 20px; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 15px; margin-bottom: 30px; }
        .stat-card { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 20px; border-radius: 10px; text-align: center; }
        .success { background: #d1fae5; color: #065f46; padding: 12px; border-radius: 6px; margin-bottom: 15px; display: none; }
        .success.show { display: block; }
        .progress-indicator { text-align: center; padding: 20px; background: #f0f4ff; border-radius: 8px; margin-bottom: 20px; }
        .progress-bar { width: 100%; height: 8px; background: #ddd; border-radius: 4px; overflow: hidden; margin-bottom: 10px; }
        .progress-fill { height: 100%; background: #10b981; width: 0%; transition: width 0.3s; }
        .day-summary { background: #e0e7ff; padding: 15px; border-radius: 8px; margin-bottom: 20px; border-left: 4px solid #667eea; }
        .day-summary h2 { color: #667eea; font-size: 18px; margin-bottom: 8px; }
    </style>
</head>

        <div class="header">

            <p>Dynamic Curriculum Platform</p>
        </div>

                    <label>Your Name</label>
                    <input type="text" id="trainerName" placeholder="Enter your name">
                </div>
                <div class="form-group">
                    <label>Select Day</label>
                    <select id="trainerDay">
                        <option value="">Choose a day...</option>
                        <option value="1">Day 1 - Orientation, Setup & FC Foundation</option>
                        <option value="2">Day 2 - Product Knowledge & Application</option>
                        <option value="3">Day 3 - Trial / OTC + Call Flow Foundation</option>

                        <option value="10">Day 10 - Live Call Launch</option>

                </div>
                <button class="btn" onclick="trainerLogin()">Start Learning</button>
            </div>
            
            <div id="adminAuth" style="display: none;">
                <div class="form-group">
                    <label>Admin Password</label>

                </div>

        </div>
        
        <div id="trainerPortal" class="trainer-portal">

        </div>
        
        <div id="adminPortal" class="admin-portal">

            </div>
            <div class="portal-content">

    </div>

        let currentUser = null;

        async function loadSettings() {
            try {
                const response = await fetch(DB_URL + "/settings.json");
                const data = await response.json();
                settings = data || {
                    adminPassword: "admin123",
                    canvaLinks: {}
                };
            } catch (error) {
                console.error("Error loading settings:", error);
                settings = { adminPassword: "admin123", canvaLinks: {} };
            }
        }

        function setRole(role) {
            document.querySelectorAll('.role-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            
            document.getElementById('trainerAuth').style.display = role === 'trainer' ? 'block' : 'none';
            document.getElementById('adminAuth').style.display = role === 'admin' ? 'block' : 'none';
        }

        async function trainerLogin() {
            const name = document.getElementById('trainerName').value.trim();
            const day = document.getElementById('trainerDay').value;

            if (!name || !day) {
                alert('Please enter name and select day');
                return;
            }

            currentUser = { name, day };
            currentActivityIndex = 0;
            
            await fetch(DB_URL + "/sessions.json", {
                method: "POST",
                body: JSON.stringify({ trainer: name, day: day, time: new Date().toISOString() })
            }).catch(e => console.error("Error logging session:", e));
            
            document.getElementById('authSection').style.display = 'none';
            document.getElementById('trainerPortal').classList.add('active');
            
            displayCurrentActivity();
        }

        function displayCurrentActivity() {
            const dayData = curriculum[currentUser.day];
            const activities = dayData.activities;
            
            document.getElementById('dayTitle').textContent = `Day ${currentUser.day} - ${dayData.title}`;

            // Day Summary
            document.getElementById('daySummary').innerHTML = `
                <div class="day-summary">
                    <h2>Day ${currentUser.day}: ${dayData.title}</h2>
                </div>
            `;

            // Progress
            const progress = ((currentActivityIndex + 1) / activities.length) * 100;
            document.getElementById('progressSection').innerHTML = `
                <div class="progress-indicator">
                    <h3>Progress</h3>
                    <div class="progress-bar">
                        <div class="progress-fill" style="width: ${progress}%"></div>
                    </div>
                    <div style="font-size: 12px; color: #666;">Activity ${currentActivityIndex + 1} of ${activities.length}</div>
                </div>
            `;

            // Current Activity
            const currentActivity = activities[currentActivityIndex];
            const isBreak = currentActivity.type === 'Break';
            const badgeClass = isBreak ? 'break' : '';
            const cardClass = isBreak ? 'activity-card break' : 'activity-card';
            const badgeEmoji = isBreak ? '☕' : '🔴';

            const materialLink = settings?.canvaLinks?.[currentUser.day + '_' + currentActivityIndex] || '';
            const materialButton = materialLink ? 
                `<a href="${materialLink}" target="_blank" class="action-btn secondary">📊 View Materials</a>` : 
                `<button class="action-btn secondary" onclick="alert('No materials link set yet')">📊 View Materials</button>`;

            document.getElementById('trainerContent').innerHTML = `
                <div class="${cardClass}">
                    <div class="activity-header">
                        <div class="activity-title">${currentActivity.name}</div>
                        <div class="activity-time">${currentActivity.time} (${currentActivity.duration})</div>
                    </div>
                    
                    <div class="badges">
                        <span class="badge ${badgeClass}">${badgeEmoji} ${currentActivity.type}</span>
                    </div>
                    
                    <div class="activity-details">
                        <strong>Purpose:</strong> ${currentActivity.purpose || '—'}
                    </div>
                    
                    <div class="activity-actions">
                        ${materialButton}
                        <button class="action-btn primary" onclick="completeActivity()">✓ Done</button>
                    </div>
                </div>
            `;
        }

        async function completeActivity() {
            await fetch(DB_URL + "/completions.json", {
                method: "POST",
                body: JSON.stringify({ trainer: currentUser.name, day: currentUser.day, activity: currentActivityIndex, completedAt: new Date().toISOString() })
            }).catch(e => console.error("Error logging completion:", e));
            
            const activities = curriculum[currentUser.day].activities;
            if (currentActivityIndex < activities.length - 1) {
                currentActivityIndex++;
                displayCurrentActivity();
            } else {
                showCongratulations();
            }
        }

        function showCongratulations() {
            const nextDay = parseInt(currentUser.day) + 1;
            const hasNextDay = curriculum[nextDay.toString()] ? true : false;
            
            document.getElementById('trainerContent').innerHTML = `
                <div style="text-align: center; padding: 60px 30px; background: linear-gradient(135deg, #10b981 0%, #059669 100%); border-radius: 10px; color: white;">
                    <div style="font-size: 80px; margin-bottom: 20px; animation: bounce 1s infinite;">🎉</div>
                    <h2 style="font-size: 32px; margin-bottom: 10px;">Congratulations!</h2>
                    <p style="font-size: 18px; margin-bottom: 30px; opacity: 0.95;">You've completed all activities for Day ${currentUser.day}</p>
                    
                    ${hasNextDay ? `
                        <div style="background: rgba(255,255,255,0.2); padding: 20px; border-radius: 8px; margin-bottom: 30px;">
                            <p style="font-size: 16px; margin-bottom: 10px;">📅 See you tomorrow!</p>
                            <p style="font-size: 14px; opacity: 0.9;">Day ${nextDay} - ${curriculum[nextDay.toString()].title}</p>
                        </div>
                    ` : `
                        <div style="background: rgba(255,255,255,0.2); padding: 20px; border-radius: 8px; margin-bottom: 30px;">
                            <p style="font-size: 16px;">🚀 You're ready for live calls!</p>
                            <p style="font-size: 14px; opacity: 0.9;">Training complete. Excellent work!</p>
                        </div>
                    `}
                    
                    <button class="btn" onclick="logout()" style="max-width: 300px; margin: 0 auto;">← Back to Home</button>
                </div>
                
                <style>
                    @keyframes bounce {
                        0%, 100% { transform: translateY(0); }
                        50% { transform: translateY(-20px); }
                    }
                </style>
            `;
        }

        async function adminLogin() {
            const password = document.getElementById('adminPassword').value;
            
            if (!settings) {
                alert('Loading settings... please try again');
                return;
            }
            
            if (password !== settings.adminPassword) {
                alert('Incorrect password');
                return;
            }

            document.getElementById('authSection').style.display = 'none';
            document.getElementById('adminPortal').classList.add('active');
            
            loadDashboard();
            loadSettingsForm();
        }

        async function loadDashboard() {
            try {
                const response = await fetch(DB_URL + "/completions.json");
                const data = await response.json() || {};
                const items = Object.values(data).filter(v => v);
                
                const uniqueTrainers = new Set(items.map(i => i.trainer)).size;
                const completedDays = new Set(items.map(i => i.trainer + '_' + i.day)).size;
                
                let activityLog = '<div style="margin-top: 30px;"><h3 style="margin-bottom: 15px;">📋 Activity Log</h3><div style="background: #f9f9f9; border-radius: 8px; overflow: hidden;">';
                
                if (items.length === 0) {
                    activityLog += '<div style="padding: 20px; text-align: center; color: #999;">No activity yet</div>';
                } else {
                    items.reverse().slice(0, 50).forEach(item => {
                        const date = new Date(item.completedAt);
                        const timeStr = date.toLocaleTimeString('en-US', { timeZone: 'America/Chicago' });
                        const dateStr = date.toLocaleDateString('en-US', { timeZone: 'America/Chicago' });
                        activityLog += `
                            <div style="padding: 12px 15px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center;">
                                <div>
                                    <strong>${item.trainer}</strong>
                                    <div style="font-size: 12px; color: #999;">Day ${item.day} - Activity ${item.activity + 1}</div>
                                </div>
                                <div style="font-size: 12px; color: #666; text-align: right;">
                                    ${dateStr}<br>${timeStr}
                                </div>
                            </div>
                        `;
                    });
                }
                
                activityLog += '</div></div>';
                
                document.getElementById('statsGrid').innerHTML = `
                    <div class="stat-card">
                        <h4>Total Completions</h4>
                        <div style="font-size: 28px; font-weight: 700;">${items.length}</div>
                    </div>
                    <div class="stat-card">
                        <h4>Unique Trainers</h4>
                        <div style="font-size: 28px; font-weight: 700;">${uniqueTrainers}</div>
                    </div>
                    <div class="stat-card">
                        <h4>Days Completed</h4>
                        <div style="font-size: 28px; font-weight: 700;">${completedDays}</div>
                    </div>
                `;
                
                document.getElementById('statsGrid').innerHTML += activityLog;
            } catch (error) {
                console.error("Error loading dashboard:", error);
            }
        }

        function loadSettingsForm() {
            let html = '';
            for (let day = 1; day <= 10; day++) {
                const dayData = curriculum[day.toString()];
                html += `<div style="margin-bottom: 20px; border-bottom: 1px solid #ddd; padding-bottom: 15px;">
                    <h4 style="margin-bottom: 15px;">Day ${day} - ${dayData.title}</h4>`;
                
                dayData.activities.forEach((activity, idx) => {
                    const key = day + '_' + idx;
                    const value = settings?.canvaLinks?.[key] || '';
                    html += `<div class="form-group" style="margin-bottom: 10px;">
                        <label>${activity.time} - ${activity.name}</label>
                        <input type="text" id="link_${key}" value="${value}" placeholder="Canva link or material URL">
                    </div>`;
                });
                
                html += '</div>';
            }
            document.getElementById('materialLinksForm').innerHTML = html;
        }

        function switchAdminTab(tab) {
            document.querySelectorAll('.admin-tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            
            event.target.classList.add('active');
            document.getElementById(tab + '-tab').classList.add('active');
        }

        async function savePassword() {
            const newPwd = document.getElementById('newPassword').value;
            if (!newPwd) {
                alert('Please enter a password');
                return;
            }
            
            settings.adminPassword = newPwd;
            await fetch(DB_URL + "/settings.json", {
                method: "PUT",
                body: JSON.stringify(settings)
            }).then(() => {
                showSuccess();
                document.getElementById('newPassword').value = '';
            }).catch(e => alert("Error: " + e));
        }

        async function saveCanvaLinks() {
            if (!settings.canvaLinks) settings.canvaLinks = {};
            
            for (let day = 1; day <= 10; day++) {
                const dayData = curriculum[day.toString()];
                dayData.activities.forEach((activity, idx) => {
                    const key = day + '_' + idx;
                    const value = document.getElementById('link_' + key)?.value || '';
                    if (value) {
                        settings.canvaLinks[key] = value;
                    }
                });
            }
            
            await fetch(DB_URL + "/settings.json", {
                method: "PUT",
                body: JSON.stringify(settings)
            }).then(() => {
                showSuccess();
            }).catch(e => alert("Error: " + e));
        }

        function showSuccess() {
            const msg = document.getElementById('successMsg');
            msg.classList.add('show');
            setTimeout(() => msg.classList.remove('show'), 3000);
        }

        function logout() {
            if (confirm('Logout?')) {
                currentUser = null;
                currentActivityIndex = 0;
                document.getElementById('authSection').style.display = 'block';
                document.getElementById('trainerPortal').classList.remove('active');
                document.getElementById('adminPortal').classList.remove('active');
                
                document.getElementById('trainerName').value = '';
                document.getElementById('trainerDay').value = '';
                document.getElementById('adminPassword').value = '';
            }
        }

        window.addEventListener('load', () => {
            loadSettings();
        });
    </script>
</body>
</html>
