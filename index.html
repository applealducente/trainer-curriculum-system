<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trainer Portal</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 20px; }
        .container { background: white; border-radius: 12px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); max-width: 1200px; width: 100%; margin: 0 auto; overflow: hidden; }
        .header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 30px; text-align: center; }
        .header h1 { font-size: 28px; margin-bottom: 8px; }
        
        .login-screen { display: block; }
        .lobby-screen { display: none; }
        .activity-screen { display: none; }
        .admin-screen { display: none; }
        
        .login-screen.hidden { display: none; }
        .lobby-screen.active { display: block; }
        .activity-screen.active { display: block; }
        .admin-screen.active { display: block; }
        
        .auth-section { padding: 40px; max-width: 450px; margin: 40px auto; text-align: center; }
        .auth-section h2 { margin-bottom: 30px; color: #333; font-size: 24px; }
        .form-group { margin-bottom: 15px; text-align: left; }
        .form-group label { display: block; margin-bottom: 8px; color: #555; font-weight: 500; }
        .form-group input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; }
        .btn { width: 100%; padding: 12px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; }
        
        .portal-header { padding: 20px 30px; border-bottom: 1px solid #eee; display: grid; grid-template-columns: 1fr auto; gap: 20px; align-items: center; }
        .portal-header h2 { margin: 0; font-size: 20px; color: #333; }
        .header-btn { padding: 8px 12px; background: rgba(255,255,255,0.2); border: 1px solid white; color: white; border-radius: 6px; cursor: pointer; font-size: 11px; white-space: nowrap; }
        .header-btn.admin { background: rgba(255,193,7,0.2); border-color: #ffc107; color: #ffc107; }
        
        .portal-content { padding: 30px; }
        .trainer-name { text-align: center; padding: 20px; background: #f0f4ff; border-radius: 8px; margin-bottom: 30px; }
        .trainer-name h3 { color: #667eea; font-size: 16px; }
        
        .nav-tabs { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 2px solid #eee; flex-wrap: wrap; }
        .nav-tab { padding: 12px 20px; background: none; border: none; cursor: pointer; font-weight: 600; color: #999; border-bottom: 3px solid transparent; }
        .nav-tab.active { color: #667eea; border-bottom-color: #667eea; }
        
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        
        .day-tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; }
        .day-tile { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 18px; border-radius: 10px; cursor: pointer; text-align: center; transition: transform 0.2s; }
        .day-tile:hover { transform: translateY(-5px); }
        .day-tile h4 { font-size: 14px; margin-bottom: 6px; }
        .day-tile p { font-size: 11px; opacity: 0.9; }
        
        .activity-card { background: white; border: 2px solid #667eea; border-radius: 10px; padding: 20px; margin-bottom: 15px; }
        .activity-header { display: flex; justify-content: space-between; margin-bottom: 12px; align-items: center; flex-wrap: wrap; }
        .activity-title { font-size: 16px; font-weight: 600; color: #333; }
        .activity-time { font-size: 12px; color: #667eea; }
        .badges { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
        .badge { display: inline-block; padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 600; background: #e0f2fe; color: #0369a1; }
        .badge.break { background: #fef3c7; color: #92400e; }
        .activity-actions { display: flex; gap: 10px; margin-top: 15px; }
        .action-btn { flex: 1; padding: 10px; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 12px; }
        .action-btn.primary { background: #10b981; color: white; }
        .action-btn.secondary { background: #f0f0f0; color: #333; }
        
        .progress-indicator { text-align: center; padding: 15px; background: #f0f4ff; border-radius: 8px; margin-bottom: 15px; }
        .progress-bar { width: 100%; height: 6px; background: #ddd; border-radius: 3px; margin-bottom: 8px; }
        .progress-fill { height: 100%; background: #10b981; transition: width 0.3s; }
        
        .congratulations { text-align: center; padding: 50px 20px; background: linear-gradient(135deg, #10b981 0%, #059669 100%); border-radius: 10px; color: white; }
        .congratulations h2 { font-size: 32px; margin-bottom: 10px; }
        .congratulations p { font-size: 16px; margin-bottom: 30px; }
        
        .back-btn { padding: 10px 20px; background: #f0f0f0; border: 1px solid #ddd; border-radius: 6px; cursor: pointer; margin-bottom: 20px; font-size: 12px; }
        
        .async-materials { background: #fff3cd; padding: 20px; border-radius: 8px; border-left: 4px solid #ffc107; margin-bottom: 20px; }
        .async-materials h4 { color: #856404; margin-bottom: 15px; }
        .async-item { margin-bottom: 8px; color: #856404; }
        
        .day10-approval { background: #d1ecf1; padding: 20px; border-radius: 8px; border-left: 4px solid #17a2b8; margin-bottom: 20px; }
        .day10-approval h3 { color: #0c5460; margin-bottom: 15px; }
        .approval-checklist { list-style: none; background: white; padding: 15px; border-radius: 6px; }
        .approval-checklist li { padding: 8px; margin-bottom: 6px; }
        .approval-checklist input { margin-right: 10px; }
        
        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-20px); } }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📚 Trainer Portal</h1>
            <p>Dynamic Curriculum Platform</p>
        </div>
        
        <!-- LOGIN -->
        <div id="loginScreen" class="login-screen">
            <div class="auth-section">
                <h2>Welcome Back!</h2>
                <div class="form-group">
                    <label>Enter Your Name</label>
                    <input type="text" id="trainerName" placeholder="Your name">
                </div>
                <button class="btn" onclick="trainerLogin()">Start Training</button>
            </div>
        </div>
        
        <!-- LOBBY -->
        <div id="lobbyScreen" class="lobby-screen">
            <div class="portal-header">
                <h2>🏠 Training Dashboard</h2>
                <div style="display: flex; gap: 10px;">
                    <button class="header-btn admin" onclick="switchToAdmin()">🔐 Admin</button>
                    <button class="header-btn" onclick="logout()">Logout</button>
                </div>
            </div>
            <div class="portal-content">
                <div class="trainer-name">
                    <h3>Welcome, <span id="displayName"></span>! 👋</h3>
                </div>
                <div class="nav-tabs">
                    <button class="nav-tab active" onclick="switchLobbyTab('days')">📅 Days</button>
                    <button class="nav-tab" onclick="switchLobbyTab('forms')">📋 Forms</button>
                    <button class="nav-tab" onclick="switchLobbyTab('responses')">✅ Responses</button>
                </div>
                <div id="days-tab" class="tab-content active">
                    <div class="day-tiles" id="dayTiles"></div>
                </div>
                <div id="forms-tab" class="tab-content">
                    <p style="color: #666; font-size: 14px;">Forms coming soon...</p>
                </div>
                <div id="responses-tab" class="tab-content">
                    <p style="color: #666; font-size: 14px;">Responses coming soon...</p>
                </div>
            </div>
        </div>
        
        <!-- ACTIVITY -->
        <div id="activityScreen" class="activity-screen">
            <div class="portal-header">
                <h2 id="dayTitle">Day 1</h2>
                <button class="header-btn" onclick="backToLobby()">← Lobby</button>
            </div>
            <div class="portal-content">
                <button class="back-btn" onclick="backToLobby()">← Back to Lobby</button>
                <div id="progressSection"></div>
                <div id="activityContent"></div>
            </div>
        </div>
        
        <!-- ADMIN -->
        <div id="adminScreen" class="admin-screen">
            <div class="portal-header">
                <h2>🔐 Admin Dashboard</h2>
                <button class="header-btn" onclick="backToLobby()">← Lobby</button>
            </div>
            <div class="portal-content">
                <p style="color: #666; font-size: 14px;">Admin features coming soon...</p>
            </div>
        </div>
    </div>

    <script>
        const curriculum = {
            "1": { title: "Orientation, Setup & FC Foundation", activities: [
                { time: "8:00–9:00", duration: "1 hr", name: "Roll Call / Initial Attendance", delivery: "Trainer-led", purpose: "Attendance, introductions" },
                { time: "9:00–10:30", duration: "1.5 hrs", name: "Introduction & House Rules", delivery: "Trainer-led", purpose: "Set expectations" },
                { time: "10:30–10:45", duration: "15 min", name: "Paid Break", delivery: "—", purpose: "" },
                { time: "10:45–12:45", duration: "2 hrs", name: "Account Setup: Hubstaff, Slack & Gmail", delivery: "Guided setup", purpose: "Core tools access" },
                { time: "12:45–1:45", duration: "1 hr", name: "Lunch", delivery: "—", purpose: "" },
                { time: "1:45–3:45", duration: "2 hrs", name: "Onboarding Forms", delivery: "Guided setup", purpose: "Complete requirements" },
                { time: "3:45–4:00", duration: "15 min", name: "Paid Break", delivery: "—", purpose: "" },
                { time: "4:00–5:00", duration: "1 hr", name: "FC 101", delivery: "Instructor-led", purpose: "Foundation knowledge" }
            ]},
            "2": { title: "Product Knowledge & Application", activities: [
                { time: "8:00–9:00", duration: "1 hr", name: "Review Activity", delivery: "Trainer-led", purpose: "Reinforce learning" },
                { time: "9:00–10:00", duration: "1 hr", name: "FC Sales Process Playbook Part 1", delivery: "Instructor-led", purpose: "Product training" },
                { time: "10:00–10:15", duration: "15 min", name: "Paid Break", delivery: "—", purpose: "" },
                { time: "10:15–12:45", duration: "2.5 hrs", name: "FC Sales Continuation", delivery: "Instructor-led", purpose: "Continue training" },
                { time: "12:45–1:45", duration: "1 hr", name: "Lunch", delivery: "—", purpose: "" },
                { time: "1:45–2:45", duration: "1 hr", name: "Staging Websites", delivery: "Demo", purpose: "Practice prep" },
                { time: "2:45–3:45", duration: "1 hr", name: "CRM Simulation", delivery: "Guided practice", purpose: "Apply booking" },
                { time: "3:45–4:00", duration: "15 min", name: "Paid Break", delivery: "—", purpose: "" },
                { time: "4:00–5:00", duration: "1 hr", name: "Individual Practice", delivery: "Hands-on", purpose: "Build confidence" }
            ]},
            "3": { title: "Trial / OTC + Call Flow Foundation", activities: [

                { time: "8:30–10:30", duration: "2 hrs", name: "Trial & OTC Playbook", delivery: "Instructor-led", purpose: "Customer handling" },
                { time: "10:30–10:45", duration: "15 min", name: "Paid Break", delivery: "—", purpose: "" },
                { time: "10:45–12:15", duration: "1.5 hrs", name: "Call Flow Familiarization", delivery: "Instructor-led", purpose: "Connect to calls" },
                { time: "12:15–1:15", duration: "1 hr", name: "Lunch", delivery: "—", purpose: "" },
                { time: "1:15–1:45", duration: "30 min", name: "FC 101 Quiz", delivery: "Assessment", purpose: "Check knowledge" },
                { time: "1:45–3:45", duration: "2 hrs", name: "Full Journey Walkthrough", delivery: "Guided", purpose: "End-to-end" },
                { time: "3:45–4:00", duration: "15 min", name: "Paid Break", delivery: "—", purpose: "" },
                { time: "4:00–5:00", duration: "1 hr", name: "YES Customer AI", delivery: "AI simulation", purpose: "Apply knowledge" }
            ]},
            "4": { title: "YES Customer AI + Coaching", activities: [
                { time: "8:00–8:30", duration: "30 min", name: "YES Briefing", delivery: "Trainer-led", purpose: "Set expectations" },
                { time: "8:30–10:30", duration: "2 hrs", name: "Product Test", delivery: "Assessment", purpose: "Evaluate readiness" },
                { time: "10:30–10:45", duration: "15 min", name: "Paid Break", delivery: "—", purpose: "" },
                { time: "10:45–12:45", duration: "2 hrs", name: "YES Simulation", delivery: "AI simulation", purpose: "Assess application" },
                { time: "12:45–1:45", duration: "1 hr", name: "Lunch", delivery: "—", purpose: "" },
                { time: "1:45–3:45", duration: "2 hrs", name: "Coaching", delivery: "Trainer coaching", purpose: "Address gaps" },
                { time: "3:45–4:00", duration: "15 min", name: "Paid Break", delivery: "—", purpose: "" },
                { time: "4:00–5:00", duration: "1 hr", name: "Results & Direction", delivery: "Trainer-led", purpose: "Next steps" }
            ]},
            "5": { title: "Sales Discovery + AI Application", activities: [
                { time: "8:00–9:00", duration: "1 hr", name: "Trial & OTC Quiz", delivery: "Assessment", purpose: "Check retention" },
                { time: "9:00–10:00", duration: "1 hr", name: "Call Listening", delivery: "Facilitated", purpose: "Identify behaviors" },
                { time: "10:00–10:15", duration: "15 min", name: "Paid Break", delivery: "—", purpose: "" },
                { time: "10:15–12:45", duration: "2.5 hrs", name: "Sales Discovery", delivery: "Instructor-led", purpose: "Need identification" },
                { time: "12:45–1:45", duration: "1 hr", name: "Lunch", delivery: "—", purpose: "" },
                { time: "1:45–3:45", duration: "2 hrs", name: "Discovery Simulation", delivery: "AI simulation", purpose: "Apply in scenarios" },
                { time: "3:45–4:00", duration: "15 min", name: "Paid Break", delivery: "—", purpose: "" },
                { time: "4:00–5:00", duration: "1 hr", name: "Full-Call Practice", delivery: "AI simulation", purpose: "Integrate discovery" }
            ]},
            "6": { title: "Core Sales Skills + AI Application", activities: [
                { time: "8:00–9:30", duration: "1.5 hrs", name: "Hook, Engage & Close", delivery: "Instructor-led", purpose: "Strengthen behaviors" },
                { time: "9:30–10:30", duration: "1 hr", name: "Features as Benefits 1", delivery: "Instructor-led", purpose: "Connect features" },
                { time: "10:30–10:45", duration: "15 min", name: "Paid Break", delivery: "—", purpose: "" },
                { time: "10:45–11:45", duration: "1 hr", name: "Features as Benefits 2", delivery: "Instructor-led", purpose: "Continue training" },
                { time: "11:45–12:45", duration: "1 hr", name: "Objection Handling 1", delivery: "Instructor-led", purpose: "Response dev" },
                { time: "12:45–1:45", duration: "1 hr", name: "Lunch", delivery: "—", purpose: "" },
                { time: "1:45–2:45", duration: "1 hr", name: "Objection Handling 2", delivery: "Instructor-led", purpose: "Continue dev" },
                { time: "2:45–3:00", duration: "15 min", name: "Paid Break", delivery: "—", purpose: "" },
                { time: "3:00–5:00", duration: "2 hrs", name: "Skills AI Simulation", delivery: "AI simulation", purpose: "Apply all skills" }
            ]},
            "7": { title: "AI Simulation Intensive", activities: [
                { time: "8:00–10:30", duration: "2.5 hrs", name: "AI Simulation", delivery: "AI simulation", purpose: "Multiple scenarios" },
                { time: "10:30–10:45", duration: "15 min", name: "Paid Break", delivery: "—", purpose: "" },
                { time: "10:45–12:45", duration: "2 hrs", name: "AI Simulation", delivery: "AI simulation", purpose: "Continue practice" },
                { time: "12:45–1:45", duration: "1 hr", name: "Lunch", delivery: "—", purpose: "" },
                { time: "1:45–3:45", duration: "2 hrs", name: "AI Simulation", delivery: "AI simulation", purpose: "Continue practice" },
                { time: "3:45–4:00", duration: "15 min", name: "Paid Break", delivery: "—", purpose: "" },
                { time: "4:00–5:00", duration: "1 hr", name: "Performance Review", delivery: "AI simulation", purpose: "Evaluate readiness" }
            ]},
            "8": { title: "Mock Call Certification", activities: [

                { time: "10:30–10:45", duration: "15 min", name: "Paid Break", delivery: "—", purpose: "" },
                { time: "10:45–12:45", duration: "2 hrs", name: "Mock Call Cert", delivery: "Certification", purpose: "Additional assessment" },
                { time: "12:45–1:45", duration: "1 hr", name: "Lunch", delivery: "—", purpose: "" },
                { time: "1:45–3:45", duration: "2 hrs", name: "Coaching", delivery: "Trainer coaching", purpose: "Address gaps" },
                { time: "3:45–4:00", duration: "15 min", name: "Paid Break", delivery: "—", purpose: "" },
                { time: "4:00–5:00", duration: "1 hr", name: "Live Launch Prep", delivery: "Trainer-led", purpose: "Day 10 readiness" }
            ]},
            "9": { title: "Systems, Tools & Live-Call Readiness", activities: [
                { time: "8:00–8:30", duration: "30 min", name: "Morning Stand-up", delivery: "Trainer-led", purpose: "Set tone" },
                { time: "8:30–10:30", duration: "2 hrs", name: "QA Talk", delivery: "QA-led", purpose: "Quality standards" },
                { time: "10:30–10:45", duration: "15 min", name: "Paid Break", delivery: "—", purpose: "" },
                { time: "10:45–12:15", duration: "1.5 hrs", name: "HubSpot Setup 1", delivery: "Trainer-guided", purpose: "Navigate systems" },
                { time: "12:15–1:15", duration: "1 hr", name: "Lunch", delivery: "—", purpose: "" },
                { time: "1:15–2:45", duration: "1.5 hrs", name: "HubSpot Setup 2", delivery: "Trainer-guided", purpose: "Continue setup" },
                { time: "2:45–3:00", duration: "15 min", name: "Paid Break", delivery: "—", purpose: "" },
                { time: "3:00–4:00", duration: "1 hr", name: "Lead Management", delivery: "Trainer-led", purpose: "CRM processes" },
                { time: "4:00–5:00", duration: "1 hr", name: "Disposition Guide", delivery: "Demo", purpose: "Final review" },
                { asyncMaterials: true, materials: ["Pay Structure", "PV (Protocol Violation)", "ZTP (Zero Tolerance Policy)", "Nesting Expectations", "Nesting House Rules"] }
            ]},
            "10": { title: "Live Call Launch", activities: [
                { validation: true },
                { time: "8:00–8:30", duration: "30 min", name: "Morning Stand-up", delivery: "Trainer-led", purpose: "Team sync" },
                { time: "8:30–10:30", duration: "2 hrs", name: "🔴 LIVE CALLS", delivery: "Production calls", purpose: "Real customer calls" },
                { time: "10:30–10:45", duration: "15 min", name: "Paid Break", delivery: "—", purpose: "" },
                { time: "10:45–12:45", duration: "2 hrs", name: "🔴 LIVE CALLS", delivery: "Production calls", purpose: "Real customer calls" },
                { time: "12:45–1:45", duration: "1 hr", name: "Lunch", delivery: "—", purpose: "" },
                { time: "1:45–3:45", duration: "2 hrs", name: "🔴 LIVE CALLS", delivery: "Production calls", purpose: "Real customer calls" },
                { time: "3:45–4:00", duration: "15 min", name: "Paid Break", delivery: "—", purpose: "" },
                { time: "4:00–4:30", duration: "30 min", name: "🔴 LIVE CALLS", delivery: "Production calls", purpose: "Real customer calls" },

            ]}
        };

        let currentUser = null;
        let currentDay = null;
        let currentActivityIndex = 0;

        function trainerLogin() {
            const name = document.getElementById('trainerName').value.trim();
            if (!name) {
                alert('Please enter your name');
                return;
            }
            currentUser = { name };
            document.getElementById('loginScreen').classList.add('hidden');
            document.getElementById('lobbyScreen').classList.add('active');
            document.getElementById('displayName').textContent = name;
            loadDayTiles();
        }

        function loadDayTiles() {
            let html = '';
            for (let day = 1; day <= 10; day++) {
                const dayData = curriculum[day.toString()];
                html += `<div class="day-tile" onclick="startDay(${day})"><h4>Day ${day}</h4><p>${dayData.title}</p></div>`;
            }
            document.getElementById('dayTiles').innerHTML = html;
        }

        function startDay(day) {
            currentDay = day.toString();
            currentActivityIndex = 0;
            document.getElementById('lobbyScreen').classList.remove('active');
            document.getElementById('activityScreen').classList.add('active');
            displayCurrentActivity();
        }

        function displayCurrentActivity() {
            const dayData = curriculum[currentDay];
            document.getElementById('dayTitle').textContent = `Day ${currentDay} - ${dayData.title}`;
            
            if (currentDay === "9") {
                document.getElementById('progressSection').innerHTML = '';
                const asyncData = dayData.activities.find(a => a.asyncMaterials);
                document.getElementById('activityContent').innerHTML = `
                    <div class="async-materials">
                        <h4>📚 ASYNC MATERIALS - Complete on Your Own Time</h4>
                        <p style="font-size: 12px; margin-bottom: 12px;">These must be reviewed before Day 10:</p>
                        ${asyncData.materials.map(mat => `<div class="async-item">✓ ${mat}</div>`).join('')}
                    </div>
                    <div class="activity-card">
                        <div class="activity-title" style="margin-bottom: 15px;">Day 9 Activities</div>
                        ${dayData.activities.filter(a => !a.asyncMaterials).map(act => `
                            <div style="padding: 12px; border-bottom: 1px solid #eee; margin-bottom: 10px;">
                                <div style="display: flex; justify-content: space-between; margin-bottom: 6px;">
                                    <div style="font-weight: 600; font-size: 13px;">${act.name}</div>
                                    <div style="font-size: 11px; color: #667eea;">${act.time}</div>
                                </div>
                                <div style="font-size: 11px; color: #666;">${act.delivery}</div>
                            </div>
                        `).join('')}
                    </div>
                `;
                return;
            }
            
            if (currentDay === "10") {
                document.getElementById('progressSection').innerHTML = '';
                document.getElementById('activityContent').innerHTML = `
                    <div class="day10-approval">
                        <h3>✅ FORM VALIDATION & ASYNC MATERIALS CHECK (First 30 mins)</h3>
                        <p style="margin-bottom: 15px; font-size: 13px;">Verify all requirements completed:</p>
                        <ul class="approval-checklist">
                            <li><input type="checkbox"> All forms completed</li>
                            <li><input type="checkbox"> Pay Structure reviewed</li>
                            <li><input type="checkbox"> PV (Protocol Violation) reviewed</li>
                            <li><input type="checkbox"> ZTP (Zero Tolerance Policy) reviewed</li>
                            <li><input type="checkbox"> Nesting Expectations reviewed</li>
                            <li><input type="checkbox"> Nesting House Rules reviewed</li>
                        </ul>
                        <button class="btn" style="margin-top: 20px;" onclick="approveDay10()">✓ All Requirements Met - Ready to Dial!</button>
                    </div>
                    <div class="activity-card">
                        <div class="activity-title" style="margin-bottom: 15px;">Day 10 - Live Call Launch</div>
                        ${curriculum["10"].activities.filter(a => !a.validation).map(act => `
                            <div style="padding: 12px; border-bottom: 1px solid #eee; margin-bottom: 10px;">
                                <div style="display: flex; justify-content: space-between; margin-bottom: 6px;">
                                    <div style="font-weight: 600; font-size: 13px;">${act.name}</div>
                                    <div style="font-size: 11px; color: #667eea;">${act.time}</div>
                                </div>
                                <div style="font-size: 11px; color: #666;">${act.delivery}</div>
                            </div>
                        `).join('')}
                    </div>
                `;
                return;
            }
            
            const activities = dayData.activities;
            const activity = activities[currentActivityIndex];
            const progress = ((currentActivityIndex + 1) / activities.length) * 100;
            
            document.getElementById('progressSection').innerHTML = `
                <div class="progress-indicator">
                    <div class="progress-bar"><div class="progress-fill" style="width: ${progress}%"></div></div>
                    <div style="font-size: 12px; color: #666;">Activity ${currentActivityIndex + 1} of ${activities.length}</div>
                </div>
            `;
            
            document.getElementById('activityContent').innerHTML = `
                <div class="activity-card">
                    <div class="activity-header">
                        <div class="activity-title">${activity.name}</div>
                        <div class="activity-time">${activity.time}</div>
                    </div>
                    <div class="badges">
                        <span class="badge ${activity.delivery === '—' ? 'break' : ''}">${activity.delivery}</span>
                    </div>
                    <div class="activity-actions">
                        <button class="action-btn primary" onclick="completeActivity()">✓ Done</button>
                    </div>
                </div>
            `;
        }

        function completeActivity() {
            const dayData = curriculum[currentDay];
            if (currentActivityIndex < dayData.activities.length - 1) {
                currentActivityIndex++;
                displayCurrentActivity();
            } else {
                showCongratulations();
            }
        }

        function approveDay10() {
            document.getElementById('activityContent').innerHTML = `
                <div class="congratulations">
                    <div style="font-size: 80px; margin-bottom: 20px; animation: bounce 1s infinite;">🚀</div>
                    <h2>GOODLUCK!</h2>
                    <h2 style="font-size: 36px; margin-bottom: 30px;">CLOSE A LOT OF SALES!</h2>
                    <p style="font-size: 18px;">Time to make those calls! 📞</p>
                    <button class="btn" style="max-width: 300px; margin: 30px auto 0;" onclick="backToLobby()">→ Back to Lobby</button>
                </div>
            `;
        }

        function showCongratulations() {
            document.getElementById('activityContent').innerHTML = `
                <div class="congratulations">
                    <div style="font-size: 80px; margin-bottom: 20px; animation: bounce 1s infinite;">🎉</div>
                    <h2>Congratulations!</h2>
                    <p>You've completed all activities for Day ${currentDay}</p>
                    <button class="btn" style="max-width: 300px; margin: 30px auto 0;" onclick="backToLobby()">→ Back to Lobby</button>
                </div>
            `;
        }

        function switchLobbyTab(tab) {
            document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            event.target.classList.add('active');
            document.getElementById(tab + '-tab').classList.add('active');
        }

        function backToLobby() {
            currentDay = null;
            currentActivityIndex = 0;
            document.getElementById('activityScreen').classList.remove('active');
            document.getElementById('adminScreen').classList.remove('active');
            document.getElementById('lobbyScreen').classList.add('active');
        }

        function switchToAdmin() {
            const password = prompt('Enter admin password:');
            if (password === 'admin123') {
                document.getElementById('lobbyScreen').classList.remove('active');
                document.getElementById('adminScreen').classList.add('active');
            } else {
                alert('Incorrect password');
            }
        }

        function logout() {
            if (confirm('Logout?')) {
                currentUser = null;
                document.getElementById('loginScreen').classList.remove('hidden');
                document.getElementById('lobbyScreen').classList.remove('active');
                document.getElementById('trainerName').value = '';
            }
        }
    </script>
</body>
</html>
