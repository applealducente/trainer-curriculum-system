<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trainer Portal</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 20px; }
        .container { background: white; border-radius: 12px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); max-width: 900px; margin: 0 auto; overflow: hidden; }
        .header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 30px; text-align: center; }
        .header h1 { font-size: 28px; margin-bottom: 8px; }
        .auth-section { padding: 40px; max-width: 450px; margin: 40px auto; text-align: center; }
        .auth-section h2 { margin-bottom: 30px; color: #333; font-size: 24px; }
        .role-buttons { display: flex; gap: 15px; margin-bottom: 30px; }
        .role-btn { flex: 1; padding: 12px 20px; border: 2px solid #ddd; background: white; border-radius: 8px; cursor: pointer; font-weight: 500; }
        .role-btn.active { border-color: #667eea; background: #667eea; color: white; }
        .form-group { margin-bottom: 15px; text-align: left; }
        .form-group label { display: block; margin-bottom: 8px; color: #555; font-weight: 500; }
        .form-group input, .form-group select { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; }
        .btn { width: 100%; padding: 12px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; }
        .trainer-portal { display: none; }
        .trainer-portal.active { display: block; }
        .admin-portal { display: none; }
        .admin-portal.active { display: block; }
        .portal-header { padding: 20px 30px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; }
        .logout-btn { padding: 8px 16px; background: #f0f0f0; border: 1px solid #ddd; border-radius: 6px; cursor: pointer; }
        .portal-content { padding: 30px; }
        .activity-card { background: white; border: 2px solid #667eea; border-radius: 10px; padding: 25px; margin-bottom: 20px; }
        .activity-header { display: flex; justify-content: space-between; margin-bottom: 15px; }
        .activity-title { font-size: 18px; font-weight: 600; color: #333; }
        .badges { display: flex; gap: 8px; margin-bottom: 15px; }
        .badge { display: inline-block; padding: 6px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; background: #e0f2fe; color: #0369a1; }
        .activity-details { background: #f9f9f9; padding: 15px; border-radius: 6px; margin-bottom: 15px; }
        .activity-actions { display: flex; gap: 12px; }
        .action-btn { flex: 1; padding: 12px; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; }
        .action-btn.primary { background: #10b981; color: white; }
        .admin-tabs { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 2px solid #eee; }
        .admin-tab { padding: 12px 20px; background: none; border: none; cursor: pointer; font-weight: 600; color: #999; border-bottom: 3px solid transparent; }
        .admin-tab.active { color: #667eea; border-bottom-color: #667eea; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .settings-form { background: #f9f9f9; padding: 20px; border-radius: 8px; margin-bottom: 20px; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 15px; margin-bottom: 30px; }
        .stat-card { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 20px; border-radius: 10px; text-align: center; }
        .success { background: #d1fae5; color: #065f46; padding: 12px; border-radius: 6px; margin-bottom: 15px; display: none; }
        .success.show { display: block; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📚 Trainer Portal</h1>
            <p>Dynamic Curriculum Platform</p>
        </div>
        
        <div id="authSection" class="auth-section">
            <h2>Select Your Role</h2>
            <div class="role-buttons">
                <button class="role-btn active" onclick="setRole('trainer')">🎓 Trainer</button>
                <button class="role-btn" onclick="setRole('admin')">🔐 Admin</button>
            </div>
            
            <div id="trainerAuth" style="display: block;">
                <div class="form-group">
                    <label>Your Name</label>
                    <input type="text" id="trainerName" placeholder="Enter your name">
                </div>
                <div class="form-group">
                    <label>Select Day</label>
                    <select id="trainerDay">
                        <option value="">Choose a day...</option>
                        <option value="1">Day 1</option>
                        <option value="2">Day 2</option>
                        <option value="3">Day 3</option>
                    </select>
                </div>
                <button class="btn" onclick="trainerLogin()">Start Learning</button>
            </div>
            
            <div id="adminAuth" style="display: none;">
                <div class="form-group">
                    <label>Admin Password</label>
                    <input type="password" id="adminPassword" placeholder="Enter password">
                </div>
                <button class="btn" onclick="adminLogin()">Access Admin</button>
            </div>
        </div>
        
        <div id="trainerPortal" class="trainer-portal">
            <div class="portal-header">
                <h2>Trainer Portal</h2>
                <button class="logout-btn" onclick="logout()">Logout</button>
            </div>
            <div class="portal-content">
                <div id="trainerContent"></div>
            </div>
        </div>
        
        <div id="adminPortal" class="admin-portal">
            <div class="portal-header">
                <h2>Admin Dashboard</h2>
                <button class="logout-btn" onclick="logout()">Logout</button>
            </div>
            <div class="portal-content">
                <div class="admin-tabs">
                    <button class="admin-tab active" onclick="switchAdminTab('dashboard')">📊 Dashboard</button>
                    <button class="admin-tab" onclick="switchAdminTab('settings')">⚙️ Settings</button>
                </div>
                
                <div id="dashboard-tab" class="tab-content active">
                    <div class="stats-grid" id="statsGrid"></div>
                </div>
                
                <div id="settings-tab" class="tab-content">
                    <div class="success" id="successMsg">✓ Saved to Firebase!</div>
                    
                    <div class="settings-form">
                        <h3>🔐 Change Password</h3>
                        <div class="form-group">
                            <input type="password" id="newPassword" placeholder="New password">
                        </div>
                        <button class="btn" onclick="savePassword()">Save</button>
                    </div>
                    
                    <div class="settings-form">
                        <h3>🎨 Edit Canva Links</h3>
                        <div class="form-group">
                            <label>Day 1</label>
                            <input type="text" id="canva1" placeholder="https://www.canva.com/...">
                        </div>
                        <div class="form-group">
                            <label>Day 2</label>
                            <input type="text" id="canva2" placeholder="https://www.canva.com/...">
                        </div>
                        <div class="form-group">
                            <label>Day 3</label>
                            <input type="text" id="canva3" placeholder="https://www.canva.com/...">
                        </div>
                        <button class="btn" onclick="saveCanva()">Save</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const DB_URL = "https://trainer-portal-2ef55-default-rtdb.firebaseio.com";
        
        let currentUser = null;
        let settings = null;

        // Load settings from Firebase REST API
        async function loadSettings() {
            try {
                const response = await fetch(DB_URL + "/settings.json");
                const data = await response.json();
                settings = data || {
                    adminPassword: "admin123",
                    canvaLinks: {
                        "1": "https://www.canva.com",
                        "2": "https://www.canva.com",
                        "3": "https://www.canva.com"
                    }
                };
                console.log("Settings loaded:", settings);
            } catch (error) {
                console.error("Error loading settings:", error);
                settings = { adminPassword: "admin123", canvaLinks: {} };
            }
        }

        function setRole(role) {
            document.querySelectorAll('.role-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            
            document.getElementById('trainerAuth').style.display = role === 'trainer' ? 'block' : 'none';
            document.getElementById('adminAuth').style.display = role === 'admin' ? 'block' : 'none';
        }

        async function trainerLogin() {
            const name = document.getElementById('trainerName').value.trim();
            const day = document.getElementById('trainerDay').value;

            if (!name || !day) {
                alert('Please enter name and select day');
                return;
            }

            currentUser = { name, day };
            
            // Log to Firebase
            await fetch(DB_URL + "/sessions.json", {
                method: "POST",
                body: JSON.stringify({ trainer: name, day: day, time: new Date().toISOString() })
            }).catch(e => console.error("Error logging session:", e));
            
            document.getElementById('authSection').style.display = 'none';
            document.getElementById('trainerPortal').classList.add('active');
            
            const canvaLink = settings?.canvaLinks?.[day] || 'https://www.canva.com';
            document.getElementById('trainerContent').innerHTML = `
                <h2>Day ${day}</h2>
                <div class="activity-card">
                    <div class="activity-header">
                        <div class="activity-title">Day ${day} Activity</div>
                    </div>
                    <div class="badges">
                        <span class="badge">🔴 Synchronous</span>
                    </div>
                    <div class="activity-details">
                        <strong>Trainer:</strong> ${name}<br>
                        Learning activities for Day ${day}
                    </div>
                    <div class="activity-actions">
                        <a href="${canvaLink}" target="_blank" class="action-btn" style="background: #f0f0f0; color: #333; text-decoration: none; display: flex; align-items: center; justify-content: center;">View Materials</a>
                        <button class="action-btn primary" onclick="completeDay()">✓ Done</button>
                    </div>
                </div>
            `;
        }

        async function completeDay() {
            await fetch(DB_URL + "/completions.json", {
                method: "POST",
                body: JSON.stringify({ trainer: currentUser.name, day: currentUser.day, time: new Date().toISOString() })
            }).catch(e => console.error("Error logging completion:", e));
            
            alert('✓ Day completed! Great work!');
        }

        async function adminLogin() {
            const password = document.getElementById('adminPassword').value;
            
            if (!settings) {
                alert('Loading settings... please try again');
                return;
            }
            
            if (password !== settings.adminPassword) {
                alert('Incorrect password');
                return;
            }

            document.getElementById('authSection').style.display = 'none';
            document.getElementById('adminPortal').classList.add('active');
            
            loadDashboard();
            loadSettingsForm();
        }

        async function loadDashboard() {
            try {
                const response = await fetch(DB_URL + "/completions.json");
                const data = await response.json() || {};
                const items = Object.values(data).filter(v => v);
                
                document.getElementById('statsGrid').innerHTML = `
                    <div class="stat-card">
                        <h4>Total Completions</h4>
                        <div style="font-size: 28px; font-weight: 700;">${items.length}</div>
                    </div>
                    <div class="stat-card">
                        <h4>Unique Trainers</h4>
                        <div style="font-size: 28px; font-weight: 700;">${new Set(items.map(i => i.trainer)).size}</div>
                    </div>
                `;
            } catch (error) {
                console.error("Error loading dashboard:", error);
            }
        }

        function loadSettingsForm() {
            if (settings?.canvaLinks) {
                document.getElementById('canva1').value = settings.canvaLinks["1"] || '';
                document.getElementById('canva2').value = settings.canvaLinks["2"] || '';
                document.getElementById('canva3').value = settings.canvaLinks["3"] || '';
            }
        }

        function switchAdminTab(tab) {
            document.querySelectorAll('.admin-tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            
            event.target.classList.add('active');
            document.getElementById(tab + '-tab').classList.add('active');
        }

        async function savePassword() {
            const newPwd = document.getElementById('newPassword').value;
            if (!newPwd) {
                alert('Please enter a password');
                return;
            }
            
            settings.adminPassword = newPwd;
            await fetch(DB_URL + "/settings.json", {
                method: "PUT",
                body: JSON.stringify(settings)
            }).then(() => {
                showSuccess();
                document.getElementById('newPassword').value = '';
            }).catch(e => alert("Error: " + e));
        }

        async function saveCanva() {
            if (!settings.canvaLinks) settings.canvaLinks = {};
            
            settings.canvaLinks["1"] = document.getElementById('canva1').value;
            settings.canvaLinks["2"] = document.getElementById('canva2').value;
            settings.canvaLinks["3"] = document.getElementById('canva3').value;
            
            await fetch(DB_URL + "/settings.json", {
                method: "PUT",
                body: JSON.stringify(settings)
            }).then(() => {
                showSuccess();
            }).catch(e => alert("Error: " + e));
        }

        function showSuccess() {
            const msg = document.getElementById('successMsg');
            msg.classList.add('show');
            setTimeout(() => msg.classList.remove('show'), 3000);
        }

        function logout() {
            if (confirm('Logout?')) {
                currentUser = null;
                document.getElementById('authSection').style.display = 'block';
                document.getElementById('trainerPortal').classList.remove('active');
                document.getElementById('adminPortal').classList.remove('active');
                
                document.getElementById('trainerName').value = '';
                document.getElementById('trainerDay').value = '';
                document.getElementById('adminPassword').value = '';
            }
        }

        // Initialize
        window.addEventListener('load', () => {
            loadSettings();
        });
    </script>
</body>
</html>
